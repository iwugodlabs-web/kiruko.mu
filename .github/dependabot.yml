# Dependabot — automated dependency & security update PRs.
# Grouped weekly so we get one PR per ecosystem instead of a flood.
# Security updates are always raised immediately regardless of schedule.
version: 2
updates:
  # Backend (FastAPI / Python)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]

  # Web (Next.js)
  - package-ecosystem: "npm"
    directory: "/web/ivor-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]

  # Mobile (Expo / React Native) — SECURITY-ONLY.
  # open-pull-requests-limit: 0 disables routine version-bump PRs while STILL
  # allowing Dependabot to raise security-advisory fixes. Routine Expo/RN
  # version currency is done as a deliberate, tested SDK upgrade — not a
  # 100-package auto-batch that breaks the build.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # GitHub Actions — grouped so bumps arrive as ONE PR, not one-per-action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
