name: Mobile Checks

# Guards the offline data layer and the release pipeline on every PR and on
# every push to main. Two production incidents motivate the manifest check:
# a journal entry with no manifest export (missing table on device) and a
# manifest import with no SQL file (Expo bundler crash).

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
  push:
    branches: [main]

jobs:
  drizzle-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Drizzle journal ↔ manifest ↔ files consistency
        working-directory: mobile
        run: node scripts/check-drizzle-manifest.js

  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (offline sync workers)
        working-directory: mobile
        run: npx jest app/private_dashboard/services/__tests__ --silent
