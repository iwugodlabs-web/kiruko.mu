name: Security Scan

# Defense-in-depth checks that run alongside the test suite:
#   - gitleaks: catches committed secrets (API keys, service-account
#     private keys, tokens) before they reach main.
#   - npm audit: flags known CVEs in the web and mobile dependency trees.
#   - pip-audit: flags known CVEs in the backend dependency tree.
#
# The dependency-audit jobs are non-blocking (continue-on-error) so a newly
# disclosed transitive CVE doesn't wall off every PR — they surface the
# advisories in the run log and summary. gitleaks IS blocking: a leaked
# secret should stop the merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [web/ivor-web, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit (high & critical)
        working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high

  pip-audit:
    name: pip audit (backend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend requirements
        working-directory: backend
        run: pip-audit -r requirements.txt --desc
